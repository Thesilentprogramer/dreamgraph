# One web service. The image starts moto, HydraDB 0.4.0, and the dashboard.
# Render sets PORT. /healthz returns 200 only after graph-node answers.
# Change plan to 1c-2g if the seed is OOM-killed on 512 MB.

services:
  - type: web
    name: dreamgraph
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # No persistent disk in this Blueprint. The free plan cannot mount one,
    # and the plan above is left unchanged. On a paid instance you can add:
    #   disk:
    #     name: dreamgraph-state
    #     mountPath: /var/lib/dreamgraph
    #     sizeGB: 1
    # and set DG_STATE_DIR=/var/lib/dreamgraph/state. container_boot.sh
    # restores that directory into moto before graph-node starts.
    envVars:
      - key: HYDRADB_AUTH_TOKEN
        generateValue: true
      - key: DG_SEED_ON_BOOT
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
