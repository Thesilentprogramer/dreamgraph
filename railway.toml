# DreamGraph app service. HydraDB is a second service; see deploy/hydradb.railway.toml.
# Do not deploy from this file until you have read README.md. This repo was not deployed.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
